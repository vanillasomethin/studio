# Runs the repo's invariant guards on every PR and every push to main.
#
# Why this exists: there is no test runner configured here. Every guard is a
# scripts/verify-*.mjs suite that exits non-zero on failure, and nothing ever
# invoked them in CI — so a broken guard was indistinguishable from a passing
# one. buildSlotLoop migrated to the multi-creative model
# (filler: { campaignId, creativeIds }) and gained a dayIndex parameter, while
# verify-slots.mjs kept building the old single-creative shape and passing its
# weights Map into dayIndex's position. The suite threw on its first assertion
# and ran ZERO checks. Nobody noticed, because nobody ran it.
#
# tsc cannot catch that class of drift: the suites are .mjs and tsconfig's
# include is ["**/*.ts", "**/*.tsx"], so they sit outside the type-checked set
# regardless of allowJs. Executing them is the only thing that proves they work.
#
# Runner: tsx, not `node --experimental-strip-types`. src/lib imports its
# siblings without file extensions (`import { db } from './db'`) — fine for the
# Next bundler, unresolvable by Node's own ESM loader, which fails
# verify-pop-periods and verify-tier-links with ERR_MODULE_NOT_FOUND. tsx
# resolves them and runs on Node 20 and 22 alike.
#
# NOTE: this job deliberately has NO DATABASE_URL, and must not be given one.
# verify-store-ids sweeps live Store rows when one is set and skips that section
# when it is not (scripts/verify-store-ids.mjs). A real URL would point CI at
# production; a dummy one only makes the sweep fail to connect. Unset is correct
# — the suite still runs all of its pure shape checks.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # @prisma/client is a generated package and verify-pop-periods reaches it
      # transitively (pop-export -> db). Constructing a PrismaClient needs the
      # generated code to exist; it opens no connection. Reads the schema only.
      - name: Generate Prisma client
        run: npx prisma generate

      # verify-transcode-skip encodes real fixtures and reads them back through the exact
      # ffprobe argument list transcode-lambda/index.mjs uses. That half is the only thing
      # proving the conformance predicate matches real ffprobe output (level as a number,
      # profile spelled "Constrained Baseline") and pinning the scale filter's output
      # dimensions — the filter that was silently squashing 1080x1920 masters to 608x1080.
      # The runner image does not ship ffmpeg, so without this step that half self-skips
      # and a scale regression lands green. Installed unconditionally, and allowed to fail
      # the job if apt does: a soft failure here is indistinguishable from the guard rot
      # this workflow exists to prevent.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Globbed rather than enumerated from package.json on purpose: a hardcoded
      # list would silently skip any suite someone forgets to add — the same
      # "guard exists but never runs" failure this workflow prevents. A glob
      # cannot drift out of sync with the directory.
      #
      # Every suite runs even after one fails, so a single broken invariant
      # doesn't mask the rest; the job still fails at the end.
      - name: Verify invariants
        run: |
          set -uo pipefail
          shopt -s nullglob
          suites=(scripts/verify-*.mjs)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::no scripts/verify-*.mjs found - did they move?"
            exit 1
          fi

          failed=()
          for f in "${suites[@]}"; do
            echo "::group::$f"
            if ./node_modules/.bin/tsx "$f"; then
              echo "--- ok"
            else
              echo "--- FAILED"
              failed+=("$f")
            fi
            echo "::endgroup::"
          done

          echo "ran ${#suites[@]} suite(s), ${#failed[@]} failed"
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::failing verify suites: ${failed[*]}"
            exit 1
          fi
